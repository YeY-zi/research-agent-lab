[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-lab"
version = "0.1.0"
description = "Auditable tool-using research agent with a stdio MCP server"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
research-agent = "research_agent.cli:main"
research-mcp = "research_agent.mcp:main"

[tool.setuptools.packages.find]
include = ["research_agent*"]
